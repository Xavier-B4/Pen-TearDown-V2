<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retractable Pen Teardown & Analysis</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background-color: #f8fafc; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui-panel {
      position: absolute; top: 20px; right: 20px; width: 320px;
      background: rgba(255, 255, 255, 0.95); padding: 24px;
      border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(8px); z-index: 10;
    }
    #part-title { margin-top: 0; color: #0f172a; font-size: 1.25rem; }
    #part-desc { color: #475569; line-height: 1.5; font-size: 0.95rem; }
    .engineer-badge {
      display: inline-block; margin-top: 8px; padding: 6px 12px;
      background: #e0e7ff; color: #4338ca; border-radius: 6px;
      font-weight: 600; font-size: 0.85rem;
    }
    .button-group {
      position: absolute; bottom: 30px; left: 30px; display: flex; gap: 12px; z-index: 10;
    }
    .btn {
      padding: 14px 24px; background: #2563eb; color: white;
      border: none; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 0.95rem; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-secondary { background: #475569; box-shadow: 0 4px 14px rgba(71, 85, 105, 0.25); }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  
  <div id="ui-panel">
    <h2 id="part-title">Clicker Pen Assembly</h2>
    <p id="part-desc">Click or tap on any individual component in the 3D viewer to inspect its design function and engineering discipline.</p>
    <div id="part-engineer" class="engineer-badge">Interactive Teardown</div>
  </div>

  <div class="button-group">
    <button class="btn" id="explode-btn">Toggle Exploded View</button>
    <button class="btn btn-secondary" id="reset-focus-btn">Center View</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // =========================================================================
    // 🎛️ PART DICTIONARY & BALANCED OFFSETS
    // =========================================================================
    const partData = {
      "fronttube": {
        title: "Front Barrel Tube",
        desc: "Injection-molded plastic housing with male threads to secure and house the assembly.",
        engineer: "Plastics / Mechanical Engineer",
        explodeOffset: 10.8 
      },
      "rubber": {
        title: "Ergonomic Grip",
        desc: "An ergonomic rubber sleeve designed to reduce finger fatigue and have better grip with sweaty hands.",
        engineer: "Industrial Design / Materials Engineer",
        explodeOffset: 6.5 
      },
      "ballpoint": {
        title: "Ballpoint Socket & Tip",
        desc: "Precision-machined socket housing a micro tungsten-carbide ball.",
        engineer: "Precision Mechanical Engineer",
        explodeOffset: 2.0 
      },
      "spring": {
        title: "Compression Spring",
        desc: "Coiled steel wire providing continuous backwards tension.",
        engineer: "Mechanical Engineer",
        explodeOffset: 1.0
      },
      "inktube": {
        title: "Ink Reservoir Tube",
        desc: "Extruded tube holding high-viscosity ink paste and a clear follower gel.",
        engineer: "Chemical / Manufacturing Engineer",
        explodeOffset: 0.0 // Anchored at center
      },
      "Body1": {
        title: "Ink Cartridge Cap",
        desc: "Seals the back end of the ink tube, acting as the contact surface for the clicker.",
        engineer: "Plastics / Fluid Systems Engineer",
        explodeOffset: -1.0
      },
      "Rear_Tube": {
        title: "Rear Barrel Tube",
        desc: "Rear housing tube that encloses the internal cam mechanism.",
        engineer: "Plastics Engineer",
        explodeOffset: -5.4
      },
      "clip": {
        title: "Pocket Clip",
        desc: "Compliant clip that allows the pin to be secured in a pocket when it's not being used",
        engineer: "Mechanical / Plastic Design / Industrial Design Engineer",
        explodeOffset: -8.0
      },
      "gear": {
        title: "Rotary Cam / Gear",
        desc: "The gear, or 'cam' connects to both the ink cartridge and the plunger and turns the up and down motion into a rotating motion and locks into place to cause the pen to be able to retract[1]",
        engineer: "Materials / Mechanical Engineer",
        explodeOffset: -10.5
      },
      "Click_Cap": {
        title: "Actuator / Plunger",
        desc: "Primary tactile interface transmitting direct thumb force.",
        engineer: "Mechanical Engineer",
        explodeOffset: -11.5
      }
    };

    function getCleanName(rawName) {
      const lowerRaw = rawName.toLowerCase();
      const keys = Object.keys(partData).sort((a, b) => b.length - a.length);
      for (let key of keys) {
        if (lowerRaw.includes(key.toLowerCase())) return key; 
      }
      return 'unknown';
    }

    // Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 0.05;
    controls.maxDistance = 30.0;
    controls.target.set(0, 0, 0);

    const targetOrbitCenter = new THREE.Vector3(0, 0, 0);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    const lightFront = new THREE.DirectionalLight(0xffffff, 1.6);
    lightFront.position.set(5, 8, 10);
    scene.add(lightFront);
    const lightBack = new THREE.DirectionalLight(0xffffff, 0.8);
    lightBack.position.set(-5, -4, -8);
    scene.add(lightBack);

    let modelParts = [];
    let isExploded = false;
    let selectedMesh = null;
    const loader = new GLTFLoader();

    // Load Single Assembly
    loader.load('pen_assembly.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      // Clean up Blender Cube
      const junk = [];
      model.traverse((child) => { if (child.name === 'Cube') junk.push(child); });
      junk.forEach(obj => obj.removeFromParent());

      // Flatten Hierarchy
      const allMeshes = [];
      model.traverse((child) => {
        if (child.isMesh) allMeshes.push(child);
      });
      allMeshes.forEach((mesh) => {
        model.attach(mesh); 
      });

      // Center and Scale
      const rawBox = new THREE.Box3().setFromObject(model);
      const rawCenter = rawBox.getCenter(new THREE.Vector3());
      model.position.sub(rawCenter);

      const rawSize = rawBox.getSize(new THREE.Vector3());
      const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z);
      model.scale.setScalar(10.0 / maxDim);
      model.updateMatrixWorld(true);

      // Fix Thin Walls & Setup Parts
      model.traverse((child) => {
        if (child.isMesh) {
          if (child.material) {
            const materials = Array.isArray(child.material) ? child.material : [child.material];
            materials.forEach((mat) => {
              mat.side = THREE.DoubleSide;
              if (mat.transparent) mat.depthWrite = true;
            });
          }
          const meshBox = new THREE.Box3().setFromObject(child);
          child.userData.worldCenter = meshBox.getCenter(new THREE.Vector3());
          child.userData.originalLocalPos = child.position.clone();
          modelParts.push(child);
        }
      });

      // Calculate Axis
     // Hardcoded X-Axis Explosion
      const axisDir = new THREE.Vector3(-1, 0, 0);
      // Assign Offsets
      modelParts.forEach((part) => {
        const cleanName = getCleanName(part.name);
        const info = partData[cleanName];
        
        const manualOffset = (info && info.explodeOffset !== undefined) ? info.explodeOffset : 0;

        const worldOffset = axisDir.clone().multiplyScalar(manualOffset);
        const currentWorldPos = part.getWorldPosition(new THREE.Vector3());
        const targetWorldPos = currentWorldPos.clone().add(worldOffset);

        if (part.parent) {
          part.userData.explodeLocalPos = part.parent.worldToLocal(targetWorldPos.clone());
        } else {
          part.userData.explodeLocalPos = targetWorldPos.clone();
        }
      });
    });

    // Raycast Interaction
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (event) => {
      if (event.target.tagName === 'BUTTON' || event.target.closest('#ui-panel') || event.target.closest('.button-group')) return;
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(modelParts);

      if (intersects.length > 0) {
        selectedMesh = intersects[0].object;
        const cleanName = getCleanName(selectedMesh.name);
        const info = partData[cleanName] || {
          title: selectedMesh.name,
          desc: "Precision engineering component.",
          engineer: "Mechanical Engineer"
        };
        document.getElementById('part-title').innerText = info.title;
        document.getElementById('part-desc').innerText = info.desc;
        document.getElementById('part-engineer').innerText = info.engineer;

        if (isExploded) {
          const meshBox = new THREE.Box3().setFromObject(selectedMesh);
          meshBox.getCenter(targetOrbitCenter);
        }
      }
    });

    // Visual Explode Button Handlers
    const explodeBtn = document.getElementById('explode-btn');
    explodeBtn.addEventListener('click', () => {
      isExploded = !isExploded;
      
      if (isExploded) {
        explodeBtn.innerText = "Collapse View";
        explodeBtn.style.backgroundColor = "#dc2626"; // Red
      } else {
        explodeBtn.innerText = "Toggle Exploded View";
        explodeBtn.style.backgroundColor = "#2563eb"; // Blue
        targetOrbitCenter.set(0, 0, 0);
        selectedMesh = null;
      }
    });

    document.getElementById('reset-focus-btn').addEventListener('click', () => {
      targetOrbitCenter.set(0, 0, 0);
      selectedMesh = null;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      modelParts.forEach((part) => {
        const target = isExploded ? part.userData.explodeLocalPos : part.userData.originalLocalPos;
        if (target) part.position.lerp(target, 0.08);
      });
      if (isExploded && selectedMesh) {
        const meshBox = new THREE.Box3().setFromObject(selectedMesh);
        meshBox.getCenter(targetOrbitCenter);
      }
      controls.target.lerp(targetOrbitCenter, 0.08);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
