<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retractable Pen Teardown & Analysis</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; background-color: #f8fafc; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui-panel {
      position: absolute; top: 20px; right: 20px; width: 320px;
      background: rgba(255, 255, 255, 0.95); padding: 24px;
      border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(8px); z-index: 10;
    }
    #part-title { margin-top: 0; color: #0f172a; font-size: 1.25rem; }
    #part-desc { color: #475569; line-height: 1.5; font-size: 0.95rem; }
    .engineer-badge {
      display: inline-block; margin-top: 8px; padding: 6px 12px;
      background: #e0e7ff; color: #4338ca; border-radius: 6px;
      font-weight: 600; font-size: 0.85rem;
    }
    .button-group {
      position: absolute; bottom: 30px; left: 30px; display: flex; gap: 12px; z-index: 10;
    }
    .btn {
      padding: 14px 24px; background: #2563eb; color: white;
      border: none; border-radius: 8px; cursor: pointer;
      font-weight: 600; font-size: 0.95rem; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #475569; box-shadow: 0 4px 14px rgba(71, 85, 105, 0.25); }
    .btn-secondary:hover { background: #334155; }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  
  <div id="ui-panel">
    <h2 id="part-title">Clicker Pen Assembly</h2>
    <p id="part-desc">Click or tap on any individual component in the 3D viewer to inspect its design function and engineering discipline.</p>
    <div id="part-engineer" class="engineer-badge">Interactive Teardown</div>
  </div>

  <div class="button-group">
    <button class="btn" id="explode-btn">Toggle Exploded View</button>
    <button class="btn btn-secondary" id="reset-focus-btn">Center View</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const TUNING = {
      minZoom: 0.5,
      maxZoom: 30.0
    };

    // =========================================================================
    // 🎛️ MANUAL EXPLOSION OFFSETS
    // Adjust the `explodeOffset` numbers to slide parts forward or backward.
    // If a part moves the wrong way, flip the sign (e.g. 4.0 to -4.0)
    // =========================================================================
    const partData = {
      "front_tube": {
        title: "Front Barrel Tube",
        desc: "Injection-molded plastic housing with male threads to secure the assembly.",
        engineer: "Plastics / Structural Engineer",
        explodeOffset: 6.0 
      },
      "rubber": {
        title: "Ergonomic Grip",
        desc: "A thermoplastic elastomer (TPE) sleeve designed to reduce finger fatigue.",
        engineer: "Ergonomics / Materials Engineer",
        explodeOffset: 5.5 // Kept close to the front tube!
      },
      "tip": {
        title: "Ballpoint Socket & Tip",
        desc: "Precision-machined socket housing a micro tungsten-carbide ball.",
        engineer: "Precision Mechanical Engineer",
        explodeOffset: 2.0 // Kept close to the ink tube!
      },
      "ink_tube": {
        title: "Ink Reservoir Tube",
        desc: "Extruded tube holding high-viscosity ink paste and a clear follower gel.",
        engineer: "Chemical / Manufacturing Engineer",
        explodeOffset: 2.0 
      },
      "spring": {
        title: "Compression Return Spring",
        desc: "A coiled steel wire spring providing continuous backwards tension.",
        engineer: "Materials / Metallurgical Engineer",
        explodeOffset: 0.0 // 0 means it stays in the center
      },
      "ink_cap": {
        title: "Ink Cartridge Follower Cap",
        desc: "Seals the back end of the ink tube, acting as the contact surface for the clicker.",
        engineer: "Plastics / Fluid Systems Engineer",
        explodeOffset: -1.5
      },
      "gear": {
        title: "Rotary Cam / Pinion Gear",
        desc: "The critical bistable mechanism. Angled teeth force 45-degree rotation with every press.",
        engineer: "Kinematic / Mechanical Engineer",
        explodeOffset: -3.0
      },
      "clicker": {
        title: "Actuator / Plunger",
        desc: "Transmits direct thumb force down into the internal ratchet system.",
        engineer: "Mechanical Engineer",
        explodeOffset: -4.5
      },
      "back": {
        title: "Main Barrel & Clip",
        desc: "Rear housing that encloses the cam mechanism.",
        engineer: "Industrial / Plastics Engineer",
        explodeOffset: -7.0
      }
    };

    // Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = TUNING.minZoom;
    controls.maxDistance = TUNING.maxZoom;
    controls.target.set(0, 0, 0);

    const targetOrbitCenter = new THREE.Vector3(0, 0, 0);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    const lightFront = new THREE.DirectionalLight(0xffffff, 1.6);
    lightFront.position.set(5, 8, 10);
    scene.add(lightFront);
    const lightBack = new THREE.DirectionalLight(0xffffff, 0.8);
    lightBack.position.set(-5, -4, -8);
    scene.add(lightBack);

    // Loader
    let modelParts = [];
    let isExploded = false;
    let selectedMesh = null;
    const loader = new GLTFLoader();

    loader.load('pen_assembly.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      // Clean up Blender Cube if it exists
      const junk = [];
      model.traverse((child) => {
        if (child.name === 'Cube') junk.push(child);
      });
      junk.forEach(obj => obj.removeFromParent());

      // Center and scale model
      const rawBox = new THREE.Box3().setFromObject(model);
      const rawCenter = rawBox.getCenter(new THREE.Vector3());
      model.position.sub(rawCenter);

      const rawSize = rawBox.getSize(new THREE.Vector3());
      const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z);
      model.scale.setScalar(10.0 / maxDim);
      model.updateMatrixWorld(true);

      // Collect meshes and calculate centerline
      let maxDistSq = 0;
      let axisDir = new THREE.Vector3(1, 0, 0);

      model.traverse((child) => {
        if (child.isMesh) {
          if (child.material) {
            const materials = Array.isArray(child.material) ? child.material : [child.material];
            materials.forEach((mat) => {
              mat.side = THREE.DoubleSide;
              if (mat.transparent) mat.depthWrite = true;
            });
          }

          const meshBox = new THREE.Box3().setFromObject(child);
          child.userData.worldCenter = meshBox.getCenter(new THREE.Vector3());
          child.userData.originalLocalPos = child.position.clone();
          modelParts.push(child);
        }
      });

      // Find the primary axis of the pen
      for (let i = 0; i < modelParts.length; i++) {
        for (let j = i + 1; j < modelParts.length; j++) {
          const distSq = modelParts[i].userData.worldCenter.distanceToSquared(modelParts[j].userData.worldCenter);
          if (distSq > maxDistSq) {
            maxDistSq = distSq;
            axisDir.subVectors(modelParts[j].userData.worldCenter, modelParts[i].userData.worldCenter);
          }
        }
      }
      axisDir.normalize();

      // Apply the MANUAL offsets from the dictionary
      modelParts.forEach((part) => {
        const cleanName = part.name.toLowerCase().replace(/<\d+>/g, '').trim();
        
        // Grab the offset from the dictionary, default to 0 if not found
        const info = partData[cleanName];
        const manualOffset = (info && info.explodeOffset !== undefined) ? info.explodeOffset : 0;

        const worldOffset = axisDir.clone().multiplyScalar(manualOffset);
        const currentWorldPos = part.getWorldPosition(new THREE.Vector3());
        const targetWorldPos = currentWorldPos.clone().add(worldOffset);

        part.userData.explodeLocalPos = part.parent.worldToLocal(targetWorldPos.clone());
      });
    });

    // Raycast Interaction
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (event) => {
      if (event.target.tagName === 'BUTTON' || event.target.closest('#ui-panel') || event.target.closest('.button-group')) return;
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(modelParts);

      if (intersects.length > 0) {
        selectedMesh = intersects[0].object;
        const cleanName = selectedMesh.name.toLowerCase().replace(/<\d+>/g, '').trim();
        const info = partData[cleanName] || {
          title: selectedMesh.name,
          desc: "Precision engineering component.",
          engineer: "Mechanical Engineer"
        };
        document.getElementById('part-title').innerText = info.title;
        document.getElementById('part-desc').innerText = info.desc;
        document.getElementById('part-engineer').innerText = info.engineer;

        if (isExploded) {
          const meshBox = new THREE.Box3().setFromObject(selectedMesh);
          meshBox.getCenter(targetOrbitCenter);
        }
      }
    });

    // Buttons
    document.getElementById('explode-btn').addEventListener('click', () => {
      isExploded = !isExploded;
      if (!isExploded) {
        targetOrbitCenter.set(0, 0, 0);
        selectedMesh = null;
      }
    });

    document.getElementById('reset-focus-btn').addEventListener('click', () => {
      targetOrbitCenter.set(0, 0, 0);
      selectedMesh = null;
    });

    // Resize & Animate
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      modelParts.forEach((part) => {
        const target = isExploded ? part.userData.explodeLocalPos : part.userData.originalLocalPos;
        if (target) part.position.lerp(target, 0.08);
      });
      if (isExploded && selectedMesh) {
        const meshBox = new THREE.Box3().setFromObject(selectedMesh);
        meshBox.getCenter(targetOrbitCenter);
      }
      controls.target.lerp(targetOrbitCenter, 0.08);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
