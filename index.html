<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retractable Pen Teardown & Analysis</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #ui-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 320px;
      background: rgba(255, 255, 255, 0.95);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    #part-title {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.25rem;
    }
    #part-desc {
      color: #475569;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .engineer-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      background: #e0e7ff;
      color: #4338ca;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .button-group {
      position: absolute;
      bottom: 30px;
      left: 30px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .btn {
      padding: 14px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #475569;
      box-shadow: 0 4px 14px rgba(71, 85, 105, 0.25);
    }
    .btn-secondary:hover {
      background: #334155;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  
  <div id="ui-panel">
    <h2 id="part-title">Clicker Pen Assembly</h2>
    <p id="part-desc">Click or tap on any individual component in the 3D viewer to inspect its design function and engineering discipline.</p>
    <div id="part-engineer" class="engineer-badge">Interactive Teardown</div>
  </div>

  <div class="button-group">
    <button class="btn" id="explode-btn">Toggle Exploded View</button>
    <button class="btn btn-secondary" id="reset-focus-btn">Center View</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // =========================================================================
    // 🎛️ TUNING CONFIGURATION
    // =========================================================================
    const TUNING = {
      explodeDistance: 1.3,  // Distance in world units between adjacent parts (tweak up/down slightly if needed)
      minZoom: 0.5,          // Closest camera distance
      maxZoom: 30.0          // Furthest camera distance
    };
    // =========================================================================

    const partData = {
      "head": {
        title: "Front Cone / Head",
        desc: "Clear threaded nose cone that channels the ballpoint tip and provides an internal shoulder to hold the spring in compression.",
        engineer: "Manufacturing / Plastics Engineer"
      },
      "spring": {
        title: "Compression Return Spring",
        desc: "A coiled steel wire spring that provides continuous backwards tension against the refill tube to retract the pen point.",
        engineer: "Materials / Metallurgical Engineer"
      },
      "ink": {
        title: "Ink Refill & Writing Tip",
        desc: "Houses the viscous ink supply and contains the micro tungsten-carbide ball that meters ink onto the writing surface via rolling action.",
        engineer: "Precision Mechanical / Chemical Engineer"
      },
      "ink cap": {
        title: "Ink Cartridge Follower Cap",
        desc: "Seals the back end of the ink tube, preventing fluid leakage while acting as the contact surface for the internal clicking mechanism.",
        engineer: "Plastics / Fluid Systems Engineer"
      },
      "clicker": {
        title: "Actuator / Plunger (Clicker)",
        desc: "The primary tactile interface. Transmits direct thumb force down into the internal ratchet system to cycle the pen position.",
        engineer: "Ergonomics / Mechanical Engineer"
      },
      "gear": {
        title: "Rotary Cam / Pinion Gear",
        desc: "The critical bistable mechanism. Angled teeth force 45-degree rotation with every press, locking into alternating deep and shallow slots.",
        engineer: "Kinematic / Mechanical Engineer"
      },
      "back": {
        title: "Main Barrel / Rear Housing",
        desc: "Houses the pocket clip and primary internal tracks. Includes external rubberized grip ridges for user comfort and control.",
        engineer: "Industrial / Plastics Engineer"
      }
    };

    // Three.js Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = TUNING.minZoom;
    controls.maxDistance = TUNING.maxZoom;
    controls.target.set(0, 0, 0);

    const targetOrbitCenter = new THREE.Vector3(0, 0, 0);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    
    const lightFront = new THREE.DirectionalLight(0xffffff, 1.6);
    lightFront.position.set(5, 8, 10);
    scene.add(lightFront);

    const lightBack = new THREE.DirectionalLight(0xffffff, 0.8);
    lightBack.position.set(-5, -4, -8);
    scene.add(lightBack);

    // Model Loader & True Centerline Explosion Setup
    let modelParts = [];
    let isExploded = false;
    let selectedMesh = null;
    const loader = new GLTFLoader();

    loader.load('pen_assembly.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      // 1. Center the raw model at the world origin
      const rawBox = new THREE.Box3().setFromObject(model);
      const rawCenter = rawBox.getCenter(new THREE.Vector3());
      model.position.sub(rawCenter);

      // 2. Normalize length to 10 world units
      const rawSize = rawBox.getSize(new THREE.Vector3());
      const maxDim = Math.max(rawSize.x, rawSize.y, rawSize.z);
      const targetLength = 10.0;
      const scaleRatio = targetLength / maxDim;
      model.scale.setScalar(scaleRatio);

      // Force scene matrix update so world positions are accurate
      model.updateMatrixWorld(true);

      // 3. Collect individual visible meshes
      model.traverse((child) => {
        if (child.isMesh) {
          const meshBox = new THREE.Box3().setFromObject(child);
          child.userData.worldCenter = meshBox.getCenter(new THREE.Vector3());
          child.userData.originalLocalPos = child.position.clone();
          modelParts.push(child);
        }
      });

      // 4. Determine the exact centerline vector of the pen by connecting the two furthest parts
      let maxDistSq = 0;
      let axisDir = new THREE.Vector3(1, 0, 0);

      for (let i = 0; i < modelParts.length; i++) {
        for (let j = i + 1; j < modelParts.length; j++) {
          const distSq = modelParts[i].userData.worldCenter.distanceToSquared(modelParts[j].userData.worldCenter);
          if (distSq > maxDistSq) {
            maxDistSq = distSq;
            axisDir.subVectors(modelParts[j].userData.worldCenter, modelParts[i].userData.worldCenter);
          }
        }
      }
      axisDir.normalize();

      // 5. Sort parts strictly along that centerline vector (Tip to Tail)
      modelParts.sort((a, b) => {
        return a.userData.worldCenter.dot(axisDir) - b.userData.worldCenter.dot(axisDir);
      });

      // 6. Calculate exploded positions using World-to-Local translation
      const count = modelParts.length;
      modelParts.forEach((part, index) => {
        const offsetMultiplier = index - (count - 1) / 2;
        const worldOffset = axisDir.clone().multiplyScalar(offsetMultiplier * TUNING.explodeDistance);

        // Compute where the mesh should be in world space, then convert to its parent's local space
        const currentWorldPos = part.getWorldPosition(new THREE.Vector3());
        const targetWorldPos = currentWorldPos.clone().add(worldOffset);

        part.userData.explodeLocalPos = part.parent.worldToLocal(targetWorldPos.clone());
      });
    });

    // Raycast Selection & Orbit Refocusing
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (event) => {
      if (event.target.tagName === 'BUTTON' || event.target.closest('#ui-panel') || event.target.closest('.button-group')) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(modelParts);

      if (intersects.length > 0) {
        selectedMesh = intersects[0].object;
        const cleanName = selectedMesh.name.toLowerCase().replace(/<\d+>/g, '').trim();
        
        const info = partData[cleanName] || {
          title: selectedMesh.name,
          desc: "Precision engineering component.",
          engineer: "Mechanical Engineer"
        };

        document.getElementById('part-title').innerText = info.title;
        document.getElementById('part-desc').innerText = info.desc;
        document.getElementById('part-engineer').innerText = info.engineer;

        if (isExploded) {
          const meshBox = new THREE.Box3().setFromObject(selectedMesh);
          meshBox.getCenter(targetOrbitCenter);
        }
      }
    });

    // Button Handlers
    document.getElementById('explode-btn').addEventListener('click', () => {
      isExploded = !isExploded;
      if (!isExploded) {
        targetOrbitCenter.set(0, 0, 0);
        selectedMesh = null;
      }
    });

    document.getElementById('reset-focus-btn').addEventListener('click', () => {
      targetOrbitCenter.set(0, 0, 0);
      selectedMesh = null;
    });

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);

      // Interpolate part positions smoothly
      modelParts.forEach((part) => {
        const target = isExploded ? part.userData.explodeLocalPos : part.userData.originalLocalPos;
        if (target) {
          part.position.lerp(target, 0.08);
        }
      });

      // Track active part when focused
      if (isExploded && selectedMesh) {
        const meshBox = new THREE.Box3().setFromObject(selectedMesh);
        meshBox.getCenter(targetOrbitCenter);
      }

      controls.target.lerp(targetOrbitCenter, 0.08);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
