<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retractable Pen Teardown & Analysis</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    #ui-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 320px;
      background: rgba(255, 255, 255, 0.95);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    #part-title {
      margin-top: 0;
      color: #1a1a1a;
      font-size: 1.25rem;
    }
    #part-desc {
      color: #4a5568;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .engineer-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      background: #eef2ff;
      color: #4f46e5;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .btn {
      position: absolute;
      bottom: 30px;
      left: 30px;
      padding: 14px 28px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: background 0.2s;
      z-index: 10;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>
  
  <div id="ui-panel">
    <h2 id="part-title">Clicker Pen Assembly</h2>
    <p id="part-desc">Click or tap on any individual component in the 3D viewer to inspect its design function and engineering discipline.</p>
    <div id="part-engineer" class="engineer-badge">Interactive Teardown</div>
  </div>

  <button class="btn" id="explode-btn">Toggle Exploded View</button>

  <!-- Import Three.js via ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // =========================================================================
    // 🎛️ TUNING CONFIGURATION - ADJUST THESE NUMBERS FOR QUICK FINE-TUNING!
    // =========================================================================
    const CONFIG = {
      // 1. Exploded View Spacing (Distance step between adjacent parts)
      // If parts fly too far apart, decrease this (e.g. 0.015).
      // If parts are overlapping when exploded, increase this (e.g. 0.04).
      explodeSpacing: 0.025,

      // 2. Axis of Explosion: 'x', 'y', or 'z'
      // Set to whichever axis runs lengthwise along your pen.
      explodeAxis: 'z',

      // 3. Zoom Distances
      minZoom: 0.01,  // How close you can zoom in (micro-close to inspect small features)
      maxZoom: 2.0,   // How far you can pull back (prevents losing the pen in space)

      // 4. Initial Camera Framing Multiplier
      // 1.0 = very tight start, 1.5 = comfortable frame, 2.5 = pulled back frame
      initialFrameScale: 1.4
    };
    // =========================================================================

    // Component Metadata
    const partData = {
      "head": {
        title: "Front Cone / Head",
        desc: "Clear threaded nose cone that channels the ballpoint tip and provides an internal shoulder to hold the spring in compression.",
        engineer: "Manufacturing / Plastics Engineer"
      },
      "spring": {
        title: "Compression Return Spring",
        desc: "A coiled steel wire spring that provides continuous backwards tension against the refill tube to retract the pen point.",
        engineer: "Materials / Metallurgical Engineer"
      },
      "ink": {
        title: "Ink Refill & Writing Tip",
        desc: "Houses the viscous ink supply and contains the micro tungsten-carbide ball that meters ink onto the writing surface via rolling action.",
        engineer: "Precision Mechanical / Chemical Engineer"
      },
      "ink cap": {
        title: "Ink Cartridge Follower Cap",
        desc: "Seals the back end of the ink tube, preventing fluid leakage while acting as the contact surface for the internal clicking mechanism.",
        engineer: "Plastics / Fluid Systems Engineer"
      },
      "clicker": {
        title: "Actuator / Plunger (Clicker)",
        desc: "The primary tactile interface. Transmits direct thumb force down into the internal ratchet system to cycle the pen position.",
        engineer: "Ergonomics / Mechanical Engineer"
      },
      "gear": {
        title: "Rotary Cam / Pinion Gear",
        desc: "The critical bistable mechanism. Angled teeth force 45-degree rotation with every press, locking into alternating deep and shallow slots.",
        engineer: "Kinematic / Mechanical Engineer"
      },
      "back": {
        title: "Main Barrel / Rear Housing",
        desc: "Houses the pocket clip and primary internal tracks. Includes external rubberized grip ridges for user comfort and control.",
        engineer: "Industrial / Plastics Engineer"
      }
    };

    // Three.js Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 1000);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = CONFIG.minZoom;
    controls.maxDistance = CONFIG.maxZoom;
    controls.maxPolarAngle = Math.PI / 2 + 0.1;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    // Model Loader & Positioning Logic
    let modelParts = [];
    let isExploded = false;
    const loader = new GLTFLoader();

    loader.load('pen_assembly.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      // 1. Calculate actual size and center of your pen
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      // Focus camera orbit target on the center of the pen
      controls.target.copy(center);

      // 2. Position camera nicely based on actual pen dimensions
      const maxDim = Math.max(size.x, size.y, size.z);
      const startDist = maxDim * CONFIG.initialFrameScale;
      camera.position.set(center.x, center.y + (maxDim * 0.35), center.z + startDist);
      camera.lookAt(center);
      controls.update();

      // 3. Setup component explosion vectors
      model.traverse((child) => {
        if (child.isMesh) {
          child.userData.originalPos = child.position.clone();
          
          const partIndex = modelParts.length;
          const offsetDistance = (partIndex - 3) * CONFIG.explodeSpacing; 

          // Determine vector direction according to chosen axis
          let offsetVector = new THREE.Vector3();
          if (CONFIG.explodeAxis.toLowerCase() === 'x') {
            offsetVector.set(offsetDistance, 0, 0);
          } else if (CONFIG.explodeAxis.toLowerCase() === 'y') {
            offsetVector.set(0, offsetDistance, 0);
          } else {
            offsetVector.set(0, 0, offsetDistance);
          }

          child.userData.explodePos = child.position.clone().add(offsetVector);
          modelParts.push(child);
        }
      });
    });

    // Raycasting Click Selection
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (event) => {
      if (event.target.tagName === 'BUTTON' || event.target.closest('#ui-panel')) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(modelParts);

      if (intersects.length > 0) {
        const clickedMesh = intersects[0].object;
        const cleanName = clickedMesh.name.toLowerCase().replace(/<\d+>/g, '').trim();
        
        const info = partData[cleanName] || {
          title: clickedMesh.name,
          desc: "Precision mechanical component.",
          engineer: "Mechanical Engineer"
        };

        document.getElementById('part-title').innerText = info.title;
        document.getElementById('part-desc').innerText = info.desc;
        document.getElementById('part-engineer').innerText = info.engineer;
      }
    });

    // Explode Toggle Logic
    document.getElementById('explode-btn').addEventListener('click', () => {
      isExploded = !isExploded;
      modelParts.forEach((part) => {
        const target = isExploded ? part.userData.explodePos : part.userData.originalPos;
        part.position.copy(target);
      });
    });

    // Window Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
